<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>로그인 · 품질관리 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<link rel="stylesheet" href="/login.css">
</head>
<body>
  <button class="langBtn" id="btnLang" type="button">EN</button>
  <div class="box">
    <div class="logo">🔬</div>
    <h1 data-i18n>공정 불량 분석 대시보드</h1>

    <!-- 로그인 -->
    <form id="fLogin">
      <p class="sub" data-i18n>사내 전용 — 로그인이 필요합니다</p>
      <label for="u" data-i18n>아이디</label>
      <input id="u" name="username" autocomplete="username" required autofocus>
      <label for="p" data-i18n>비밀번호</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button id="btnLogin" type="submit" data-i18n>로그인</button>
      <div class="switch-link"><a id="toSignup" data-i18n>계정이 없으신가요? 사용 신청</a></div>
    </form>

    <!-- 사용 신청 -->
    <form id="fSignup" hidden>
      <p class="sub" data-i18n>사용 신청 — 관리자 승인 후 로그인할 수 있습니다</p>
      <label for="su"><span data-i18n>아이디</span> <small data-i18n>(영문·숫자 3~32자)</small></label>
      <input id="su" name="username" autocomplete="username" required>
      <label for="sp"><span data-i18n>비밀번호</span> <small data-i18n>(8자 이상)</small></label>
      <input id="sp" name="password" type="password" autocomplete="new-password" required minlength="8">
      <label for="sp2" data-i18n>비밀번호 확인</label>
      <input id="sp2" name="password2" type="password" autocomplete="new-password" required minlength="8">
      <label for="sn"><span data-i18n>소속·이름</span> <small data-i18n>(선택, 승인 시 참고용)</small></label>
      <input id="sn" name="note" data-i18n-ph="예) 사출팀 정준상" placeholder="예) 사출팀 정준상">
      <div class="err" id="signupErr"></div>
      <div class="ok" id="signupOk" hidden></div>
      <button id="btnSignup" type="submit" data-i18n>사용 신청</button>
      <div class="switch-link"><a id="toLogin" data-i18n>이미 계정이 있으신가요? 로그인</a></div>
    </form>
  </div>
<script src="/login.js"></script>
</body>
</html>
