<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>로그인 · 품질관리 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<style>
  :root { --brand: #0f3460; --brand-2: #1b5c96; --ink: #1b2532; --ink-2: #55637a; --line: #dfe4ec; --radius: 10px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0f3460, #1b5c96); font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    position: relative;
  }
  .langBtn {
    position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-weight: 700;
  }
  .box {
    background: #fff; border-radius: 14px; padding: 34px 32px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .logo { font-size: 34px; text-align: center; margin-bottom: 6px; }
  h1 { font-size: 17px; text-align: center; margin: 0 0 4px; color: var(--ink); }
  p.sub { text-align: center; font-size: 12.5px; color: var(--ink-2); margin: 0 0 22px; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; margin-bottom: 14px; font: inherit;
  }
  input:focus { outline: 2px solid var(--brand-2); outline-offset: 1px; }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--brand-2); color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer; font: inherit;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #c8322c; font-size: 12.5px; margin: -6px 0 14px; min-height: 1em; }
  .ok { color: #16785a; font-size: 12.5px; margin: -6px 0 14px; background: #e7f1ea; padding: 9px 11px; border-radius: 7px; }
  .switch-link { text-align: center; margin-top: 4px; }
  .switch-link a { font-size: 12.5px; color: var(--brand-2); cursor: pointer; text-decoration: none; }
  .switch-link a:hover { text-decoration: underline; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <button class="langBtn" id="btnLang" type="button">EN</button>
  <div class="box">
    <div class="logo">🔬</div>
    <h1 data-i18n>공정 불량 분석 대시보드</h1>

    <!-- 로그인 -->
    <form id="fLogin">
      <p class="sub" data-i18n>사내 전용 — 로그인이 필요합니다</p>
      <label for="u" data-i18n>아이디</label>
      <input id="u" name="username" autocomplete="username" required autofocus>
      <label for="p" data-i18n>비밀번호</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button id="btnLogin" type="submit" data-i18n>로그인</button>
      <div class="switch-link"><a id="toSignup" data-i18n>계정이 없으신가요? 사용 신청</a></div>
    </form>

    <!-- 사용 신청 -->
    <form id="fSignup" hidden>
      <p class="sub" data-i18n>사용 신청 — 관리자 승인 후 로그인할 수 있습니다</p>
      <label for="su"><span data-i18n>아이디</span> <small data-i18n>(영문·숫자 3~32자)</small></label>
      <input id="su" name="username" autocomplete="username" required>
      <label for="sp"><span data-i18n>비밀번호</span> <small data-i18n>(8자 이상)</small></label>
      <input id="sp" name="password" type="password" autocomplete="new-password" required minlength="8">
      <label for="sp2" data-i18n>비밀번호 확인</label>
      <input id="sp2" name="password2" type="password" autocomplete="new-password" required minlength="8">
      <label for="sn"><span data-i18n>소속·이름</span> <small data-i18n>(선택, 승인 시 참고용)</small></label>
      <input id="sn" name="note" data-i18n-ph="예) 사출팀 정준상" placeholder="예) 사출팀 정준상">
      <div class="err" id="signupErr"></div>
      <div class="ok" id="signupOk" hidden></div>
      <button id="btnSignup" type="submit" data-i18n>사용 신청</button>
      <div class="switch-link"><a id="toLogin" data-i18n>이미 계정이 있으신가요? 로그인</a></div>
    </form>
  </div>
<script>
  const I18N_EN = {
    '로그인 · 품질관리 대시보드': 'Login · Quality Management Dashboard',
    '공정 불량 분석 대시보드': 'Defect Analysis Dashboard',
    '사내 전용 — 로그인이 필요합니다': 'Internal use only — Login required',
    '아이디': 'Username',
    '비밀번호': 'Password',
    '로그인': 'Log In',
    '계정이 없으신가요? 사용 신청': "Don't have an account? Request access",
    '사용 신청 — 관리자 승인 후 로그인할 수 있습니다': 'Request Access — you can log in after admin approval',
    '(영문·숫자 3~32자)': '(letters/numbers, 3-32 chars)',
    '(8자 이상)': '(8+ characters)',
    '비밀번호 확인': 'Confirm Password',
    '소속·이름': 'Department/Name',
    '(선택, 승인 시 참고용)': '(optional, for reference at approval)',
    '예) 사출팀 정준상': 'e.g. Injection Team, Jane Doe',
    '사용 신청': 'Request Access',
    '이미 계정이 있으신가요? 로그인': 'Already have an account? Log in',
    '확인 중…': 'Checking…',
    '로그인 실패': 'Login failed',
    '비밀번호가 서로 다릅니다': 'Passwords do not match',
    '신청 중…': 'Submitting…',
    '신청 실패': 'Request failed'
  };

  let LANG = localStorage.getItem('qc_lang') || 'ko';
  function t(ko) {
    if (LANG !== 'en') return ko;
    return I18N_EN[ko] !== undefined ? I18N_EN[ko] : ko;
  }
  function applyI18n() {
    document.documentElement.lang = LANG;
    document.getElementById('btnLang').textContent = LANG === 'en' ? '한국어' : 'EN';
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      if (el.dataset.i18nOrig === undefined) el.dataset.i18nOrig = el.textContent;
      el.textContent = t(el.dataset.i18nOrig);
    });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => {
      el.placeholder = t(el.dataset.i18nPh);
    });
  }
  document.getElementById('btnLang').addEventListener('click', () => {
    LANG = LANG === 'en' ? 'ko' : 'en';
    localStorage.setItem('qc_lang', LANG);
    applyI18n();
  });
  applyI18n();

  const fLogin = document.getElementById('fLogin');
  const fSignup = document.getElementById('fSignup');

  document.getElementById('toSignup').addEventListener('click', () => {
    fLogin.hidden = true;
    fSignup.hidden = false;
  });
  document.getElementById('toLogin').addEventListener('click', () => {
    fSignup.hidden = true;
    fLogin.hidden = false;
  });

  fLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('loginErr');
    const btn = document.getElementById('btnLogin');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = t('확인 중…');
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || t('로그인 실패'));
      location.href = '/';
    } catch (e2) {
      err.textContent = e2.message;
      btn.disabled = false;
      btn.textContent = t('로그인');
    }
  });

  fSignup.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('signupErr');
    const ok = document.getElementById('signupOk');
    const btn = document.getElementById('btnSignup');
    err.textContent = '';
    ok.hidden = true;
    const password = document.getElementById('sp').value;
    const password2 = document.getElementById('sp2').value;
    if (password !== password2) {
      err.textContent = t('비밀번호가 서로 다릅니다');
      return;
    }
    btn.disabled = true;
    btn.textContent = t('신청 중…');
    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('su').value, password, note: document.getElementById('sn').value, lang: LANG })
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || t('신청 실패'));
      ok.hidden = false;
      ok.textContent = body.message;
      fSignup.reset();
    } catch (e2) {
      err.textContent = e2.message;
    } finally {
      btn.disabled = false;
      btn.textContent = t('사용 신청');
    }
  });
</script>
</body>
</html>
